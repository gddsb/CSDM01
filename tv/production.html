<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MES · 生产实时监控中心</title>
    <link rel="stylesheet" type="text/css" href="styles/tv.css">
</head>
<body>
    <!-- TV 大屏容器 -->
    <div id="bs-container"></div>

    <!-- 脚本加载（严格顺序：config → request → utils → charts → production） -->
    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript" src="lib/request.js"></script>
    <script type="text/javascript" src="lib/utils.js"></script>
    <script type="text/javascript" src="lib/canvas-charts.js"></script>
    <script type="text/javascript" src="screens/production.js"></script>

    <!-- 页面启动 -->
    <script type="text/javascript">
    (function (global) {
        'use strict';

        /** 遥控器键盘事件（独立访问时也支持切页） */
        function onKeyDown(e) {
            var key = e.key || '';
            var keyCode = e.keyCode || 0;

            // 如果在 iframe 中，向上冒泡给父页面处理
            if (global.parent && global.parent !== global.self) {
                // 向上层派发，由 index.html 的总控接管
                try {
                    global.parent.postMessage({ type: 'tv-key', key: key, keyCode: keyCode }, '*');
                } catch (err) { /* 跨域忽略 */ }
            }

            // 独立访问时，↑ 呼菜单（本页暂不实现，留给后续扩展）
            if (key === 'ArrowUp' || keyCode === 38) {
                // 预留：后续每个大屏也可以有自己的遥控器菜单
                e.preventDefault();
            }
        }

        function init() {
            // 启动生产大屏
            global.TVProduction.init('bs-container');

            // 绑定键盘监听
            if (global.addEventListener) {
                global.addEventListener('keydown', onKeyDown);
            } else if (global.attachEvent) {
                global.attachEvent('onkeydown', onKeyDown);
            }

            console.log('[TV Production] 生产实时监控中心已启动');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })(window);
    </script>
</body>
</html>
