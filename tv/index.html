<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MES 大屏总控 —— 电视终端</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#060d1b; }
        .wrap { position:fixed; top:0; left:0; right:0; bottom:0; overflow:hidden; background:#060d1b; }
        .wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; opacity:0; z-index:1; }
        .wrap iframe.active { opacity:1; z-index:2; }

        /* 事件覆盖层（捕获 TV 遥控器按键） */
        .capture { position:absolute; top:0; left:0; right:0; bottom:0; z-index:5; }

        /* 遥控器菜单 */
        .menu-bar {
            position:absolute; bottom:0; left:0; right:0; height:72px;
            background:linear-gradient(180deg, transparent 0%, rgba(6,13,27,0.85) 50%, rgba(6,13,27,0.95) 100%);
            padding:0 32px; z-index:20; display:none;
        }
        .menu-bar.visible { display:block; }
        .menu-item {
            position:relative; top:50%; margin-top:-24px; float:left;
            padding:10px 20px; margin:0 8px;
            background:rgba(0,50,80,0.4);
            border:1px solid rgba(0,212,255,0.15);
            border-radius:4px; color:#5b8ca8; font-size:16px;
            letter-spacing:2px; cursor:pointer;
        }
        .menu-item.focus {
            background:linear-gradient(90deg, rgba(0,212,255,0.35), rgba(0,212,255,0.12));
            border-color:rgba(0,212,255,0.8); color:#8adfff;
            box-shadow:0 0 20px rgba(0,212,255,0.4); font-weight:700;
        }
        .menu-divider {
            float:left; width:1px; height:28px; background:rgba(0,212,255,0.2);
            margin:0 12px; position:relative; top:50%; margin-top:-14px;
        }
        .menu-action {
            position:relative; top:50%; margin-top:-24px; float:right;
            padding:10px 20px; margin:0 4px;
            background:rgba(0,50,80,0.4);
            border:1px solid rgba(0,212,255,0.2); border-radius:4px;
            color:#8adfff; font-size:14px; letter-spacing:2px; cursor:pointer;
        }
        .info-bar {
            position:absolute; top:16px; right:24px; z-index:20;
            font-size:12px; color:#8B949E; letter-spacing:1px;
        }
        .info-bar .live-dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:#3FB950; margin-right:6px;
            -webkit-animation:blink 1.5s infinite; animation:blink 1.5s infinite;
        }
        @-webkit-keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
    </style>
</head>
<body>
    <div class="wrap" id="wrap">
        <!-- 大屏 iframe 容器（动态插入） -->
        <div id="frames"></div>

        <!-- 遥控器事件捕获层 -->
        <div class="capture" id="capture"></div>

        <!-- 顶部信息栏 -->
        <div class="info-bar">
            <span class="live-dot"></span>MES 大屏 · 电视终端 · 方向键切页 · ↑ 呼出菜单
        </div>

        <!-- 底部菜单条 -->
        <div class="menu-bar" id="menu-bar">
            <!-- 由 JS 动态生成 -->
        </div>
    </div>

    <script type="text/javascript" src="config.js"></script>
    <script type="text/javascript">
    /**
     * index.js —— 总控轮播 + 遥控器导航（内联，避免多文件）
     * ES5 兼容写法
     */
    (function (global) {
        'use strict';

        var CONFIG = global.TV_CONFIG;

        // 大屏列表（后续扩展时在这里加）
        var SCREENS = [
            { name: '生产实时监控', file: 'production.html', active: true }
        ];
        // 预留后续扩展：
        // { name: '质量分析看板', file: 'quality.html' },
        // { name: '管理驾驶舱',   file: 'management.html' },
        // { name: '环境看板',     file: 'environment.html' },
        // { name: '能源管理看板', file: 'energy.html' },

        var currentIdx = 0;
        var menuIdx = 0;
        var showMenu = false;
        var lastActivity = Date.now();
        var slideTimer = null;
        var hideMenuTimer = null;
        var menuBar = null;
        var capture = null;
        var framesDiv = null;

        /** 启动轮播 */
        function startSlide() {
            stopSlide();
            slideTimer = setInterval(function () {
                markActive();
                if (!showMenu) {
                    goNext();
                }
            }, CONFIG.SLIDE_DURATION);
        }
        function stopSlide() {
            if (slideTimer) { clearInterval(slideTimer); slideTimer = null; }
        }

        /** 切换到指定索引 */
        function goTo(idx) {
            if (idx < 0) idx = SCREENS.length - 1;
            if (idx >= SCREENS.length) idx = 0;
            if (idx === currentIdx) return;
            var frames = framesDiv.getElementsByTagName('iframe');
            for (var i = 0; i < frames.length; i++) {
                if (i === currentIdx) frames[i].className = '';
                if (i === idx) frames[i].className = 'active';
            }
            currentIdx = idx;
            menuIdx = idx;
            renderMenu();
        }
        function goNext() { goTo(currentIdx + 1); }
        function goPrev() { goTo(currentIdx - 1); }

        /** 标记活动（重置空闲检测） */
        function markActive() {
            lastActivity = Date.now();
            if (showMenu) scheduleHideMenu();
        }

        /** 渲染菜单 */
        function renderMenu() {
            if (!menuBar) return;
            var html = '';
            for (var i = 0; i < SCREENS.length; i++) {
                html += '<div class="menu-item' + (menuIdx === i ? ' focus' : '') + '" data-idx="' + i + '">'
                    + SCREENS[i].name + '</div>';
            }
            html += '<div class="menu-divider"></div>';
            html += '<div class="menu-action" id="btn-fullscreen">全屏</div>';
            html += '<div class="menu-action" id="btn-autoplay">自动轮播</div>';
            menuBar.innerHTML = html;

            // 绑定点击事件（Chrome 28 需要 attachEvent 或 addEventListener）
            var items = menuBar.getElementsByClassName('menu-item');
            for (var i = 0; i < items.length; i++) {
                (function (idx) {
                    items[idx].addEventListener('click', function () {
                        menuIdx = idx;
                        showMenuBar();
                        goTo(idx);
                    });
                })(i);
            }
            var fsBtn = document.getElementById('btn-fullscreen');
            if (fsBtn) fsBtn.addEventListener('click', requestFullscreen);
        }

        /** 显示/隐藏菜单条 */
        function showMenuBar() {
            showMenu = true;
            if (menuBar) menuBar.className = 'menu-bar visible';
            stopSlide();
            scheduleHideMenu();
            renderMenu();
        }
        function hideMenuBar() {
            showMenu = false;
            if (menuBar) menuBar.className = 'menu-bar';
            startSlide();
        }
        function scheduleHideMenu() {
            if (hideMenuTimer) clearTimeout(hideMenuTimer);
            hideMenuTimer = setTimeout(function () {
                var elapsed = Date.now() - lastActivity;
                if (elapsed > CONFIG.IDLE_THRESHOLD) hideMenuBar();
            }, CONFIG.IDLE_THRESHOLD);
        }

        /** 全屏请求 */
        function requestFullscreen() {
            var el = document.documentElement;
            if (document.fullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            } else {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.webkitEnterFullScreen) el.webkitEnterFullScreen();
            }
        }

        /** 键盘事件分发 */
        function onKeyDown(e) {
            markActive();
            var key = e.key || '';
            // Chrome 28 在某些 TV 盒子上的按键码可能是字符串或数值
            // 兼容 ArrowUp/ArrowDown/ArrowLeft/ArrowRight/Escape/Enter/Backspace
            // 也兼容 keyCode（老 WebView）
            var keyCode = e.keyCode || 0;

            // 菜单显示时
            if (showMenu) {
                if (key === 'ArrowLeft' || keyCode === 37) {
                    menuIdx--;
                    if (menuIdx < 0) menuIdx = SCREENS.length - 1;
                    renderMenu();
                    e.preventDefault();
                } else if (key === 'ArrowRight' || keyCode === 39) {
                    menuIdx++;
                    if (menuIdx >= SCREENS.length) menuIdx = 0;
                    renderMenu();
                    e.preventDefault();
                } else if (key === 'ArrowUp' || keyCode === 38) {
                    // 已在第一项或向上移（当前只有一行，循环）
                    menuIdx--;
                    if (menuIdx < 0) menuIdx = SCREENS.length - 1;
                    renderMenu();
                    e.preventDefault();
                } else if (key === 'ArrowDown' || keyCode === 40) {
                    menuIdx++;
                    if (menuIdx >= SCREENS.length) menuIdx = 0;
                    renderMenu();
                    e.preventDefault();
                } else if (key === 'Enter' || key === ' ' || keyCode === 13 || keyCode === 32) {
                    goTo(menuIdx);
                    hideMenuBar();
                    e.preventDefault();
                } else if (key === 'Escape' || key === 'Backspace' || keyCode === 27 || keyCode === 8) {
                    hideMenuBar();
                    e.preventDefault();
                }
                return;
            }

            // 菜单不显示时
            if (key === 'ArrowUp' || keyCode === 38) {
                // 呼出菜单
                showMenuBar();
                e.preventDefault();
            } else if (key === 'ArrowLeft' || keyCode === 37) {
                goPrev();
                e.preventDefault();
            } else if (key === 'ArrowRight' || keyCode === 39) {
                goNext();
                e.preventDefault();
            } else if (key === 'Enter' || keyCode === 13) {
                showMenuBar();
                e.preventDefault();
            } else if (key === 'Escape' || keyCode === 27) {
                hideMenuBar();
                e.preventDefault();
            }
        }

        /** 构建 iframe */
        function buildFrames() {
            if (!framesDiv) return;
            var html = '';
            for (var i = 0; i < SCREENS.length; i++) {
                html += '<iframe src="' + SCREENS[i].file + '"'
                    + ' class="' + (i === currentIdx ? 'active' : '') + '"'
                    + ' allow="fullscreen"'
                    + ' title="' + SCREENS[i].name + '"></iframe>';
            }
            framesDiv.innerHTML = html;
        }

        /** 启动 */
        function init() {
            framesDiv = document.getElementById('frames');
            menuBar = document.getElementById('menu-bar');
            capture = document.getElementById('capture');

            buildFrames();
            renderMenu();

            // 绑定键盘监听
            // Chrome 28 可能需要 window 级别的监听
            if (global.addEventListener) {
                global.addEventListener('keydown', onKeyDown);
            } else if (global.attachEvent) {
                global.attachEvent('onkeydown', onKeyDown);
            }

            // 全屏（如果支持）
            setTimeout(requestFullscreen, 300);

            // 启动轮播
            startSlide();

            console.log('[TV] MES 大屏总控已启动');
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        global.TVControl = {
            next: goNext,
            prev: goPrev,
            showMenu: showMenuBar,
            hideMenu: hideMenuBar
        };
    })(window);
    </script>
</body>
</html>
